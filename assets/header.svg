<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ashikur Rahman, full-stack TypeScript developer">
<style>
  .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .line{opacity:0;animation:cycle 12s infinite}
  .l2{animation-delay:4s}.l3{animation-delay:8s}
  @keyframes cycle{0%{opacity:0}3%{opacity:1}30%{opacity:1}33%{opacity:0}100%{opacity:0}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.line{animation:none}.l1{opacity:1}.cursor{animation:none}}
</style>
<defs>
